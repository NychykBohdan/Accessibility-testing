version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      playwright:
        patterns: ['@playwright/test', '@axe-core/playwright', 'axe-core']
      lint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-*', 'prettier']
